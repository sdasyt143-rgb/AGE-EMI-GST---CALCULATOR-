<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALC: Age, EMI, GST - All-in-One Multi Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentBlue: '#38bdf8',
                        accentPurple: '#a855f7'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- Top Header Bar -->
    <header class="bg-cardBg/80 backdrop-blur border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-calculator text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">CALC: Age, EMI, GST</h1>
                <p class="text-xs text-slate-400">All-in-One Multi Calculator</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24">

        <!-- Calculator View -->
        <section id="view-calculator" class="space-y-4">
            <!-- Mode Switcher -->
            <div class="flex bg-cardBg p-1 rounded-xl border border-slate-800">
                <button id="btn-standard" onclick="switchCalcMode('standard')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-cyan-500 text-slate-950 shadow transition">Standard</button>
                <button id="btn-scientific" onclick="switchCalcMode('scientific')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition">Scientific</button>
            </div>

            <!-- Display -->
            <div class="bg-cardBg border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col items-end justify-end min-h-[140px] relative overflow-hidden">
                <div id="calc-history" class="text-slate-400 text-sm mb-1 h-6 truncate w-full text-right"></div>
                <div id="calc-display" class="text-4xl sm:text-5xl font-bold tracking-wider text-white break-all">0</div>
            </div>

            <!-- Scientific Keypad (Hidden by default) -->
            <div id="scientific-pad" class="grid grid-cols-5 gap-2 hidden">
                <button onclick="appendFunc('sin')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-cyan-400 font-medium transition text-sm">sin</button>
                <button onclick="appendFunc('cos')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-cyan-400 font-medium transition text-sm">cos</button>
                <button onclick="appendFunc('tan')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-cyan-400 font-medium transition text-sm">tan</button>
                <button onclick="appendValue('(')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-slate-300 font-medium transition text-sm">(</button>
                <button onclick="appendValue(')')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-slate-300 font-medium transition text-sm">)</button>
                <button onclick="appendFunc('sqrt')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-cyan-400 font-medium transition text-sm">√</button>
                <button onclick="appendFunc('sq')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-cyan-400 font-medium transition text-sm">x²</button>
                <button onclick="appendFunc('log')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-cyan-400 font-medium transition text-sm">log</button>
                <button onclick="appendValue('Math.PI')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-cyan-400 font-medium transition text-sm">π</button>
                <button onclick="appendValue('Math.E')" class="p-3 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-cyan-400 font-medium transition text-sm">e</button>
            </div>

            <!-- Standard Keypad -->
            <div class="grid grid-cols-4 gap-3">
                <button onclick="clearDisplay()" class="p-4 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-bold rounded-2xl transition border border-rose-500/20">AC</button>
                <button onclick="backspace()" class="p-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl transition"><i class="fa-solid fa-delete-left"></i></button>
                <button onclick="appendValue('%')" class="p-4 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold rounded-2xl transition">%</button>
                <button onclick="appendValue('/')" class="p-4 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 font-bold rounded-2xl transition border border-cyan-500/20">÷</button>

                <button onclick="appendValue('7')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">7</button>
                <button onclick="appendValue('8')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">8</button>
                <button onclick="appendValue('9')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">9</button>
                <button onclick="appendValue('*')" class="p-4 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 font-bold rounded-2xl transition border border-cyan-500/20">×</button>

                <button onclick="appendValue('4')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">4</button>
                <button onclick="appendValue('5')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">5</button>
                <button onclick="appendValue('6')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">6</button>
                <button onclick="appendValue('-')" class="p-4 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 font-bold rounded-2xl transition border border-cyan-500/20">-</button>

                <button onclick="appendValue('1')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">1</button>
                <button onclick="appendValue('2')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">2</button>
                <button onclick="appendValue('3')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">3</button>
                <button onclick="appendValue('+')" class="p-4 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 font-bold rounded-2xl transition border border-cyan-500/20">+</button>

                <button onclick="appendValue('0')" class="col-span-2 p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800 text-left pl-6">0</button>
                <button onclick="appendValue('.')" class="p-4 bg-cardBg hover:bg-slate-800 text-white font-semibold rounded-2xl transition border border-slate-800">.</button>
                <button onclick="calculateResult()" class="p-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-2xl transition shadow-lg shadow-cyan-500/30">=</button>
            </div>
        </section>

        <!-- Financial & Special Calculators View -->
        <section id="view-financial" class="space-y-6 hidden">
            <!-- Tabs -->
            <div class="flex overflow-x-auto space-x-2 pb-2 scrollbar-none">
                <button onclick="switchFinTab('gst')" id="fin-tab-gst" class="px-4 py-2 bg-cyan-500 text-slate-950 font-semibold rounded-xl text-sm whitespace-nowrap transition">GST</button>
                <button onclick="switchFinTab('emi')" id="fin-tab-emi" class="px-4 py-2 bg-cardBg text-slate-300 font-semibold rounded-xl text-sm whitespace-nowrap transition border border-slate-800">EMI</button>
                <button onclick="switchFinTab('age')" id="fin-tab-age" class="px-4 py-2 bg-cardBg text-slate-300 font-semibold rounded-xl text-sm whitespace-nowrap transition border border-slate-800">Age</button>
                <button onclick="switchFinTab('discount')" id="fin-tab-discount" class="px-4 py-2 bg-cardBg text-slate-300 font-semibold rounded-xl text-sm whitespace-nowrap transition border border-slate-800">Discount</button>
                <button onclick="switchFinTab('profit')" id="fin-tab-profit" class="px-4 py-2 bg-cardBg text-slate-300 font-semibold rounded-xl text-sm whitespace-nowrap transition border border-slate-800">Profit & Loss</button>
            </div>

            <!-- GST Calculator Panel -->
            <div id="panel-gst" class="bg-cardBg border border-slate-800 p-6 rounded-2xl space-y-4">
                <h3 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-percent text-cyan-400 mr-2"></i> GST Calculator</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Initial Amount ($)</label>
                    <input type="number" id="gst-amount" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Enter amount">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">GST Rate (%)</label>
                    <input type="number" id="gst-rate" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Enter GST %" value="18">
                </div>
                <button onclick="calculateGST()" class="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20">Calculate GST</button>
                <div id="gst-result" class="mt-4 p-4 bg-slate-900/60 rounded-xl border border-slate-800/60 hidden space-y-2 text-sm"></div>
            </div>

            <!-- EMI Calculator Panel -->
            <div id="panel-emi" class="bg-cardBg border border-slate-800 p-6 rounded-2xl space-y-4 hidden">
                <h3 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-building-columns text-cyan-400 mr-2"></i> Loan EMI Calculator</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Loan Amount ($)</label>
                    <input type="number" id="emi-principal" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Loan amount">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Interest Rate (% p.a.)</label>
                    <input type="number" id="emi-rate" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Annual interest rate" value="8.5">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Loan Tenure (Months)</label>
                    <input type="number" id="emi-tenure" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Tenure in months" value="12">
                </div>
                <button onclick="calculateEMI()" class="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20">Calculate EMI</button>
                <div id="emi-result" class="mt-4 p-4 bg-slate-900/60 rounded-xl border border-slate-800/60 hidden space-y-2 text-sm"></div>
            </div>

            <!-- Age Calculator Panel -->
            <div id="panel-age" class="bg-cardBg border border-slate-800 p-6 rounded-2xl space-y-4 hidden">
                <h3 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-cake-candles text-cyan-400 mr-2"></i> Age Calculator</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Date of Birth</label>
                    <input type="date" id="age-dob" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                </div>
                <button onclick="calculateAge()" class="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20">Calculate Age</button>
                <div id="age-result" class="mt-4 p-4 bg-slate-900/60 rounded-xl border border-slate-800/60 hidden space-y-2 text-sm"></div>
            </div>

            <!-- Discount Calculator Panel -->
            <div id="panel-discount" class="bg-cardBg border border-slate-800 p-6 rounded-2xl space-y-4 hidden">
                <h3 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-tags text-cyan-400 mr-2"></i> Discount Calculator</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Original Price ($)</label>
                    <input type="number" id="disc-price" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Original price">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Discount Percentage (%)</label>
                    <input type="number" id="disc-rate" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Discount %" value="20">
                </div>
                <button onclick="calculateDiscount()" class="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20">Calculate Discount</button>
                <div id="disc-result" class="mt-4 p-4 bg-slate-900/60 rounded-xl border border-slate-800/60 hidden space-y-2 text-sm"></div>
            </div>

            <!-- Profit & Loss Calculator Panel -->
            <div id="panel-profit" class="bg-cardBg border border-slate-800 p-6 rounded-2xl space-y-4 hidden">
                <h3 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-chart-line text-cyan-400 mr-2"></i> Profit & Loss Calculator</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Cost Price ($)</label>
                    <input type="number" id="prof-cost" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Cost price">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Selling Price ($)</label>
                    <input type="number" id="prof-sell" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500" placeholder="Selling price">
                </div>
                <button onclick="calculateProfit()" class="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20">Calculate Profit / Loss</button>
                <div id="prof-result" class="mt-4 p-4 bg-slate-900/60 rounded-xl border border-slate-800/60 hidden space-y-2 text-sm"></div>
            </div>
        </section>

        <!-- History View -->
        <section id="view-history" class="space-y-4 hidden">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold text-white">Calculation History</h2>
                <button onclick="clearHistory()" class="text-xs text-rose-400 hover:underline">Clear History</button>
            </div>
            <div id="history-list" class="space-y-2">
                <!-- History items injected here -->
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-cardBg/95 backdrop-blur border-t border-slate-800 px-6 py-2 flex justify-around items-center z-50">
        <button onclick="switchNavTab('calculator')" id="nav-calculator" class="flex flex-col items-center text-cyan-400 transition">
            <i class="fa-solid fa-calculator text-lg mb-1 pointer-events-none"></i>
            <span class="text-xs font-medium pointer-events-none">Calculator</span>
        </button>
        <button onclick="switchNavTab('financial')" id="nav-financial" class="flex flex-col items-center text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-wallet text-lg mb-1 pointer-events-none"></i>
            <span class="text-xs font-medium pointer-events-none">Tools</span>
        </button>
        <button onclick="switchNavTab('history')" id="nav-history" class="flex flex-col items-center text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-clock-rotate-left text-lg mb-1 pointer-events-none"></i>
            <span class="text-xs font-medium pointer-events-none">History</span>
        </button>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        // Calculator State
        let currentInput = "0";
        let historyString = "";
        let isScientific = false;
        let currentTab = 'calculator';
        let historyLog = JSON.parse(localStorage.getItem('calc_history') || '[]');

        const displayEl = document.getElementById('calc-display');
        const historyEl = document.getElementById('calc-history');

        function updateDisplay() {
            displayEl.innerText = currentInput;
            historyEl.innerText = historyString;
        }

        function appendValue(val) {
            if (currentInput === "0" && val !== ".") {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function appendFunc(func) {
            if (func === 'sin') currentInput += 'Math.sin(';
            else if (func === 'cos') currentInput += 'Math.cos(';
            else if (func === 'tan') currentInput += 'Math.tan(';
            else if (func === 'sqrt') currentInput += 'Math.sqrt(';
            else if (func === 'sq') currentInput += '**2';
            else if (func === 'log') currentInput += 'Math.log10(';
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = "0";
            historyString = "";
            updateDisplay();
        }

        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function calculateResult() {
            try {
                historyString = currentInput;
                // Remove extra spaces and normalize operators
                let expr = currentInput.replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/');
                
                // Handle percentage dynamically with any operator (+, -, *, /)
                while (/(\d+(?:\.\d+)?)([\+\-])(\d+(?:\.\d+)?)%/.test(expr)) {
                    expr = expr.replace(/(\d+(?:\.\d+)?)([\+\-])(\d+(?:\.\d+)?)%/, (match, num1, op, num2) => {
                        return `${num1}${op}(${num1}*${num2}/100)`;
                    });
                }
                while (/(\d+(?:\.\d+)?)([\*\/])(\d+(?:\.\d+)?)%/.test(expr)) {
                    expr = expr.replace(/(\d+(?:\.\d+)?)([\*\/])(\d+(?:\.\d+)?)%/, (match, num1, op, num2) => {
                        return `${num1}${op}(${num2}/100)`;
                    });
                }
                expr = expr.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');

                let res = eval(expr);
                currentInput = String(parseFloat(res.toFixed(6)));
                
                // Add to history
                historyLog.unshift({ expr: historyString, res: currentInput, date: new Date().toLocaleTimeString() });
                if (historyLog.length > 20) historyLog.pop();
                localStorage.setItem('calc_history', JSON.stringify(historyLog));
                renderHistory();
                updateDisplay();
            } catch (e) {
                currentInput = "Error";
                updateDisplay();
                setTimeout(() => { currentInput = "0"; updateDisplay(); }, 1200);
            }
        }

        function switchCalcMode(mode) {
            const stdBtn = document.getElementById('btn-standard');
            const sciBtn = document.getElementById('btn-scientific');
            const sciPad = document.getElementById('scientific-pad');

            if (mode === 'scientific') {
                isScientific = true;
                sciBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-cyan-500 text-slate-950 shadow transition";
                stdBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
                sciPad.classList.remove('hidden');
            } else {
                isScientific = false;
                stdBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-cyan-500 text-slate-950 shadow transition";
                sciBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
                sciPad.classList.add('hidden');
            }
        }

        function switchNavTab(tab) {
            currentTab = tab;
            const views = ['calculator', 'financial', 'history'];
            views.forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
                document.getElementById(`nav-${v}`).className = "flex flex-col items-center text-slate-400 hover:text-white transition";
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).className = "flex flex-col items-center text-cyan-400 transition";
            if (tab === 'history') renderHistory();
        }

        function switchFinTab(subTab) {
            const tabs = ['gst', 'emi', 'age', 'discount', 'profit'];
            tabs.forEach(t => {
                document.getElementById(`panel-${t}`).classList.add('hidden');
                document.getElementById(`fin-tab-${t}`).className = "px-4 py-2 bg-cardBg text-slate-300 font-semibold rounded-xl text-sm whitespace-nowrap transition border border-slate-800";
            });
            document.getElementById(`panel-${subTab}`).classList.remove('hidden');
            document.getElementById(`fin-tab-${subTab}`).className = "px-4 py-2 bg-cyan-500 text-slate-950 font-semibold rounded-xl text-sm whitespace-nowrap transition";
        }

        // Financial Calculators
        function calculateGST() {
            const amt = parseFloat(document.getElementById('gst-amount').value) || 0;
            const rate = parseFloat(document.getElementById('gst-rate').value) || 0;
            const gstAmount = (amt * rate) / 100;
            const total = amt + gstAmount;

            const resEl = document.getElementById('gst-result');
            resEl.classList.remove('hidden');
            resEl.innerHTML = `
                <div class="flex justify-between"><span>GST Amount:</span> <strong class="text-cyan-400">$${gstAmount.toFixed(2)}</strong></div>
                <div class="flex justify-between"><span>Total Amount:</span> <strong class="text-white">$${total.toFixed(2)}</strong></div>
            `;
        }

        function calculateEMI() {
            const p = parseFloat(document.getElementById('emi-principal').value) || 0;
            const annualRate = parseFloat(document.getElementById('emi-rate').value) || 0;
            const months = parseInt(document.getElementById('emi-tenure').value) || 1;

            const r = annualRate / 12 / 100;
            const emi = (p * r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
            const totalPayment = emi * months;
            const totalInterest = totalPayment - p;

            const resEl = document.getElementById('emi-result');
            resEl.classList.remove('hidden');
            resEl.innerHTML = `
                <div class="flex justify-between"><span>Monthly EMI:</span> <strong class="text-cyan-400">$${isNaN(emi) ? 0 : emi.toFixed(2)}</strong></div>
                <div class="flex justify-between"><span>Total Interest:</span> <strong class="text-white">$${isNaN(totalInterest) ? 0 : totalInterest.toFixed(2)}</strong></div>
                <div class="flex justify-between"><span>Total Payment:</span> <strong class="text-white">$${isNaN(totalPayment) ? 0 : totalPayment.toFixed(2)}</strong></div>
            `;
        }

        function calculateAge() {
            const dobVal = document.getElementById('age-dob').value;
            const resEl = document.getElementById('age-result');
            resEl.classList.remove('hidden');
            if (!dobVal) {
                resEl.innerHTML = `<span class="text-rose-400">Please select a valid date of birth.</span>`;
                return;
            }
            const dob = new Date(dobVal);
            const today = new Date();
            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            resEl.innerHTML = `
                <div class="text-center font-bold text-lg text-cyan-400">${years} Years, ${months} Months, ${days} Days</div>
            `;
        }

        function calculateDiscount() {
            const price = parseFloat(document.getElementById('disc-price').value) || 0;
            const rate = parseFloat(document.getElementById('disc-rate').value) || 0;
            const saved = (price * rate) / 100;
            const finalPrice = price - saved;

            const resEl = document.getElementById('disc-result');
            resEl.classList.remove('hidden');
            resEl.innerHTML = `
                <div class="flex justify-between"><span>You Save:</span> <strong class="text-cyan-400">$${saved.toFixed(2)}</strong></div>
                <div class="flex justify-between"><span>Final Price:</span> <strong class="text-white">$${finalPrice.toFixed(2)}</strong></div>
            `;
        }

        function calculateProfit() {
            const cost = parseFloat(document.getElementById('prof-cost').value) || 0;
            const sell = parseFloat(document.getElementById('prof-sell').value) || 0;
            const diff = sell - cost;
            const pct = cost > 0 ? (diff / cost) * 100 : 0;

            const resEl = document.getElementById('prof-result');
            resEl.classList.remove('hidden');
            resEl.innerHTML = `
                <div class="flex justify-between"><span>${diff >= 0 ? 'Profit' : 'Loss'}:</span> <strong class="${diff >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${Math.abs(diff).toFixed(2)} (${pct.toFixed(2)}%)</strong></div>
            `;
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            if (historyLog.length === 0) {
                listEl.innerHTML = `<p class="text-slate-500 text-center py-8">No calculation history yet.</p>`;
                return;
            }
            listEl.innerHTML = historyLog.map(item => `
                <div class="bg-cardBg border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <div class="text-xs text-slate-400">${item.date}</div>
                        <div class="text-sm text-slate-300 font-mono">${item.expr}</div>
                    </div>
                    <div class="text-lg font-bold text-cyan-400 font-mono">= ${item.res}</div>
                </div>
            `).join('');
        }

        function clearHistory() {
            historyLog = [];
            localStorage.removeItem('calc_history');
            renderHistory();
        }
    </script>
</body>
</html>
